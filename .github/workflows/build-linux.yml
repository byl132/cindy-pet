name: build-linux
# 在 GitHub 的 Ubuntu 机器上构建 Cindy 桌宠的 Linux 安装包（AppImage 与 deb，x64）。
# 用法：Actions → build-linux → Run workflow → 完成后在运行页底部下载 Artifacts。
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci || npm install
      - run: npx electron-builder --linux AppImage deb --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Cindy-linux-appimage
          path: dist/*.AppImage
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: Cindy-linux-deb
          path: dist/*.deb
          compression-level: 0
