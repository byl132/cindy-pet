name: smoke-linux
# 在 GitHub 的 Ubuntu 机器上（虚拟显示器 Xvfb）真的启动一遍 Cindy 桌宠，检查接口、跟随 Cindy、趴边指令、命令行/MCP，并截屏。
on: workflow_dispatch
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: sudo apt-get update && sudo apt-get install -y xvfb imagemagick x11-utils libnss3 libgbm1 libasound2t64 libgtk-3-0t64 libxss1 libxtst6
      - run: npm ci || npm install
      - run: npx electron-builder --linux dir --x64
      - run: xvfb-run -a -s "-screen 0 1280x800x24" bash scripts/smoke-linux.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-smoke
          path: smoke-out/
